<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Trainer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-top">
                <h1>Sudoku Trainer</h1>
                <div class="mobile-header-icons">
                    <button id="mobile-tutor-btn" class="mobile-icon-btn" aria-label="Tutor">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>
                    </button>
                    <button id="mobile-import-btn" class="mobile-icon-btn" aria-label="Import Puzzle">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </button>
                    <button id="mobile-gear-btn" class="mobile-icon-btn" aria-label="Skill Profile">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </div>
            <div class="toolbar">
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="given">Given (G)</button>
                    <button class="mode-btn" data-mode="pen">Solved (S)</button>
                    <button class="mode-btn" data-mode="pencil">Pencil (P)</button>
                </div>
                <div class="toolbar-right">
                    <button id="validate-btn" class="tool-btn">Check Solved</button>
                    <button id="auto-candidates-btn" class="tool-btn">Auto-Candidates: OFF</button>
                    <button id="import-btn" class="tool-btn">Import Puzzle</button>
                    <button id="skill-profile-btn" class="tool-btn">Skill Profile</button>
                    <button id="clear-grid-btn" class="tool-btn danger">Clear Grid</button>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="grid-container">
                <table id="sudoku-grid" class="sudoku-grid">
                    <!-- Grid cells generated by JS -->
                </table>
                <div class="grid-status">
                    <span id="mode-indicator">Mode: Given</span>
                    <span id="cell-indicator">-</span>
                </div>
            </div>

            <div class="numpad">
                <div class="numpad-row">
                    <button class="numpad-btn" data-digit="1">1</button>
                    <button class="numpad-btn" data-digit="2">2</button>
                    <button class="numpad-btn" data-digit="3">3</button>
                    <button class="numpad-btn" data-digit="4">4</button>
                    <button class="numpad-btn" data-digit="5">5</button>
                </div>
                <div class="numpad-row">
                    <button class="numpad-btn" data-digit="6">6</button>
                    <button class="numpad-btn" data-digit="7">7</button>
                    <button class="numpad-btn" data-digit="8">8</button>
                    <button class="numpad-btn" data-digit="9">9</button>
                    <button class="numpad-btn numpad-delete" data-digit="0">&times;</button>
                </div>
            </div>

            <div class="mobile-tools">
                <button id="mobile-validate-btn" class="tool-btn">Check</button>
                <button id="mobile-auto-candidates-btn" class="tool-btn">AutoCand</button>
                <button id="mobile-clear-grid-btn" class="tool-btn danger">Clear</button>
            </div>

            <div class="chat-container">
                <div class="bottom-sheet-handle">
                    <div class="handle-bar"></div>
                    <span class="handle-label">Tutor</span>
                    <button id="mobile-hint-btn" class="hint-btn handle-hint-btn">Get Hint</button>
                </div>
                <div class="chat-header">
                    <h2>Tutor</h2>
                    <div class="chat-header-right">
                        <span id="provider-status" class="provider-status"></span>
                        <button id="hint-btn" class="hint-btn">Get Hint</button>
                    </div>
                </div>
                <div id="chat-messages" class="chat-messages">
                    <div class="message tutor">
                        <p>Enter a puzzle and click <strong>Get Hint</strong> when you're stuck. I'll guide you through techniques without giving away the answer.</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Ask a follow-up question..." />
                    <button id="chat-send" class="chat-send-btn">Send</button>
                </div>
            </div>
        </main>
        <footer class="footer">
            Made by <a href="https://ben-tanen.com/" target="_blank" rel="noopener">Ben Tanen</a>, 2026
        </footer>
    </div>

    <!-- Skill Profile Modal -->
    <div id="skill-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Skill Profile</h2>
                <button id="skill-modal-close" class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="skill-modal-body">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Import Puzzle Modal -->
    <div id="ocr-modal" class="modal hidden">
        <div class="modal-content ocr-modal-content">
            <div class="modal-header">
                <h2>Import Puzzle from Image</h2>
                <button id="ocr-modal-close" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="ocr-paste-zone" class="ocr-paste-zone">
                    Click here and paste an image (Ctrl/Cmd+V)
                </div>
                <div class="ocr-divider"><span>or</span></div>
                <div class="ocr-file-row">
                    <label class="tool-btn ocr-file-btn">
                        Upload Image
                        <input type="file" id="ocr-file-input" accept="image/*" hidden>
                    </label>
                    <label class="tool-btn ocr-file-btn ocr-camera-btn">
                        Take Photo
                        <input type="file" id="ocr-camera-input" accept="image/*" capture="environment" hidden>
                    </label>
                </div>
                <div id="ocr-preview" class="ocr-preview hidden">
                    <img id="ocr-preview-img" alt="Preview" />
                </div>
                <div id="ocr-status" class="ocr-status"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/grid.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/skills.js"></script>
    <script src="/static/js/ocr.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
